<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>
<style>
body {
  background: #101525;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 15px;
}
.box {
  max-width: 450px;
  margin: auto;
  background: #202b45;
  padding: 20px;
  border-radius: 20px;
}
h1 { color: #65d6ff; }
textarea {
  width: 95%;
  height: 100px;
  border-radius: 10px;
  padding: 8px;
  font-size: 16px;
}
button {
  background: #168cff;
  color: white;
  border: 0;
  padding: 12px 25px;
  margin-top: 12px;
  border-radius: 10px;
}
</style>
</head>
<body>
<div class="box">
<h1>✨ Nova AI</h1>
<p>আপনার বাংলা AI সহকারী</p>
<textarea id="q" placeholder="প্রশ্ন লিখুন..."></textarea>
<br>
<button onclick="ask()">প্রশ্ন করুন</button>
<p id="a"></p>
</div>
<script>
function ask() {
  let q = document.getElementById("q").value.trim();
  document.getElementById("a").textContent = q
    ? "আপনার প্রশ্ন: " + q + "। আসল AI এখনো সংযুক্ত হয়নি।"
    : "আগে প্রশ্ন লিখুন।";
}
</script>
</body>
</html>
